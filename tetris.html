<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 - TETRIS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(252, 70, 107, 0.3) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-50px, -50px) rotate(180deg); }
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .game-container:hover {
            transform: translateY(-5px);
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-title {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #f093fb 50%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 12px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.3));
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.3)); }
            50% { filter: drop-shadow(0 4px 20px rgba(240, 147, 251, 0.6)); }
        }

        .game-content {
            display: flex;
            gap: 30px;
        }

        .game-board-container {
            position: relative;
        }

        #gameCanvas {
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.95) 0%, rgba(30, 30, 50, 0.95) 100%);
            image-rendering: pixelated;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 220px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.2);
            transition: all 0.3s ease;
        }

        .info-box:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(31, 38, 135, 0.3);
        }

        .info-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .info-value {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #fff 0%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #nextCanvas {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.6) 0%, rgba(30, 30, 50, 0.6) 100%);
            border-radius: 15px;
            margin: 10px auto;
            display: block;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .controls {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            font-size: 13px;
            line-height: 2;
        }

        .controls h3 {
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .control-item {
            color: rgba(255, 255, 255, 0.85);
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-key {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 11px;
            color: #f093fb;
            min-width: 60px;
            text-align: center;
            border: 1px solid rgba(240, 147, 251, 0.3);
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            border-radius: 20px;
        }

        .game-over-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .game-over-text {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #fc466b 0%, #3f5efb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .restart-text {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px 0 rgba(102, 126, 234, 0.4);
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            box-shadow: 0 6px 20px 0 rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0) scale(0.98);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="game-title">TETRIS</div>
        </div>

        <div class="game-content">
            <div class="game-board-container">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <div class="game-over-overlay" id="gameOverOverlay">
                    <div class="game-over-text">GAME OVER</div>
                    <div class="restart-text">SPACE 키를 눌러 다시 시작</div>
                </div>
            </div>

            <div class="side-panel">
                <div class="info-box">
                    <div class="info-title">점수</div>
                    <div class="info-value" id="score">0</div>
                </div>

                <div class="info-box">
                    <div class="info-title">레벨</div>
                    <div class="info-value" id="level">1</div>
                </div>

                <div class="info-box">
                    <div class="info-title">라인</div>
                    <div class="info-value" id="lines">0</div>
                </div>

                <div class="info-box">
                    <div class="info-title">다음 블록</div>
                    <canvas id="nextCanvas" width="120" height="120"></canvas>
                </div>

                <div class="controls">
                    <h3>조작법</h3>
                    <div class="control-item"><span class="control-key">←/→</span> 좌우 이동</div>
                    <div class="control-item"><span class="control-key">↑</span> 회전</div>
                    <div class="control-item"><span class="control-key">↓</span> 빠른 낙하</div>
                    <div class="control-item"><span class="control-key">SPACE</span> 즉시 낙하</div>
                    <div class="control-item"><span class="control-key">P</span> 일시정지</div>
                </div>

                <button class="button" onclick="game.restart()">새 게임</button>
            </div>
        </div>
    </div>

    <script>
        // 게임 상수
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        const COLORS = [
            null,
            '#00D9FF', // I - 시안
            '#667EEA', // J - 퍼플 블루
            '#FF6B9D', // L - 핑크
            '#FFC93C', // O - 골드
            '#00E5A0', // S - 민트
            '#C471ED', // T - 라벤더
            '#FF5E78'  // Z - 코랄
        ];

        // 테트로미노 모양 정의
        const SHAPES = [
            [], // 0은 빈 공간
            [[1,1,1,1]], // I
            [[1,0,0],[1,1,1]], // J
            [[0,0,1],[1,1,1]], // L
            [[1,1],[1,1]], // O
            [[0,1,1],[1,1,0]], // S
            [[0,1,0],[1,1,1]], // T
            [[1,1,0],[0,1,1]]  // Z
        ];

        class Tetris {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.nextCanvas = document.getElementById('nextCanvas');
                this.nextCtx = this.nextCanvas.getContext('2d');

                this.board = this.createBoard();
                this.score = 0;
                this.lines = 0;
                this.level = 1;
                this.gameOver = false;
                this.isPaused = false;

                this.currentPiece = null;
                this.nextPiece = null;

                this.dropCounter = 0;
                this.dropInterval = 1000;
                this.lastTime = 0;

                this.setupControls();
                this.init();
            }

            createBoard() {
                return Array(ROWS).fill().map(() => Array(COLS).fill(0));
            }

            init() {
                this.nextPiece = this.createPiece();
                this.currentPiece = this.createPiece();
                this.updateScore();
                this.draw();
                this.animate(0);
            }

            createPiece() {
                const type = Math.floor(Math.random() * 7) + 1;
                return {
                    shape: SHAPES[type],
                    color: type,
                    x: Math.floor(COLS / 2) - Math.floor(SHAPES[type][0].length / 2),
                    y: 0
                };
            }

            rotate(piece) {
                const rotated = [];
                const N = piece.shape.length;
                const M = piece.shape[0].length;

                for (let i = 0; i < M; i++) {
                    rotated[i] = [];
                    for (let j = 0; j < N; j++) {
                        rotated[i][j] = piece.shape[N - 1 - j][i];
                    }
                }

                const oldShape = piece.shape;
                piece.shape = rotated;

                // 회전 후 벽 충돌 체크 및 조정
                let offset = 1;
                while (this.collides(piece)) {
                    piece.x += offset;
                    offset = -(offset + (offset > 0 ? 1 : -1));
                    if (offset > piece.shape[0].length) {
                        piece.shape = oldShape;
                        return;
                    }
                }
            }

            collides(piece) {
                for (let y = 0; y < piece.shape.length; y++) {
                    for (let x = 0; x < piece.shape[y].length; x++) {
                        if (piece.shape[y][x]) {
                            const newX = piece.x + x;
                            const newY = piece.y + y;

                            if (newX < 0 || newX >= COLS || newY >= ROWS) {
                                return true;
                            }

                            if (newY >= 0 && this.board[newY][newX]) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            merge() {
                for (let y = 0; y < this.currentPiece.shape.length; y++) {
                    for (let x = 0; x < this.currentPiece.shape[y].length; x++) {
                        if (this.currentPiece.shape[y][x]) {
                            const boardY = this.currentPiece.y + y;
                            const boardX = this.currentPiece.x + x;
                            if (boardY >= 0) {
                                this.board[boardY][boardX] = this.currentPiece.color;
                            }
                        }
                    }
                }
            }

            clearLines() {
                let linesCleared = 0;

                outer: for (let y = ROWS - 1; y >= 0; y--) {
                    for (let x = 0; x < COLS; x++) {
                        if (!this.board[y][x]) {
                            continue outer;
                        }
                    }

                    // 라인 삭제 애니메이션 효과
                    const row = this.board.splice(y, 1)[0].fill(0);
                    this.board.unshift(row);
                    linesCleared++;
                    y++;
                }

                if (linesCleared > 0) {
                    this.lines += linesCleared;
                    // 점수 계산 (테트리스 오리지널 방식)
                    const points = [0, 100, 300, 500, 800];
                    this.score += points[linesCleared] * this.level;

                    // 10라인마다 레벨업
                    this.level = Math.floor(this.lines / 10) + 1;
                    this.dropInterval = 1000 - (this.level - 1) * 100;
                    if (this.dropInterval < 100) this.dropInterval = 100;

                    this.updateScore();
                }
            }

            move(dir) {
                this.currentPiece.x += dir;
                if (this.collides(this.currentPiece)) {
                    this.currentPiece.x -= dir;
                }
            }

            drop() {
                this.currentPiece.y++;
                if (this.collides(this.currentPiece)) {
                    this.currentPiece.y--;
                    this.merge();
                    this.clearLines();
                    this.currentPiece = this.nextPiece;
                    this.nextPiece = this.createPiece();

                    if (this.collides(this.currentPiece)) {
                        this.endGame();
                    }

                    this.drawNext();
                }
                this.dropCounter = 0;
            }

            hardDrop() {
                while (!this.collides(this.currentPiece)) {
                    this.currentPiece.y++;
                }
                this.currentPiece.y--;
                this.drop();
            }

            drawBlock(ctx, x, y, color, size = BLOCK_SIZE) {
                const px = x * size;
                const py = y * size;

                // 그라데이션 배경
                const gradient = ctx.createLinearGradient(px, py, px + size, py + size);
                gradient.addColorStop(0, color);
                gradient.addColorStop(1, this.adjustBrightness(color, -20));

                ctx.fillStyle = gradient;
                ctx.fillRect(px, py, size, size);

                // 부드러운 테두리
                ctx.strokeStyle = this.adjustBrightness(color, 30);
                ctx.lineWidth = 1.5;
                ctx.strokeRect(px + 0.5, py + 0.5, size - 1, size - 1);

                // 내부 하이라이트
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 1;
                ctx.strokeRect(px + 2, py + 2, size - 4, size - 4);

                // 상단 하이라이트
                const highlightGradient = ctx.createLinearGradient(px, py, px, py + size / 2);
                highlightGradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                highlightGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = highlightGradient;
                ctx.fillRect(px + 1, py + 1, size - 2, size / 2 - 1);

                // 하단 그림자
                const shadowGradient = ctx.createLinearGradient(px, py + size / 2, px, py + size);
                shadowGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
                shadowGradient.addColorStop(1, 'rgba(0, 0, 0, 0.25)');
                ctx.fillStyle = shadowGradient;
                ctx.fillRect(px + 1, py + size / 2, size - 2, size / 2 - 1);
            }

            adjustBrightness(color, percent) {
                const num = parseInt(color.replace('#', ''), 16);
                const amt = Math.round(2.55 * percent);
                const R = Math.min(255, Math.max(0, (num >> 16) + amt));
                const G = Math.min(255, Math.max(0, (num >> 8 & 0x00FF) + amt));
                const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
                return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
            }

            draw() {
                // 배경 그리기 (그라데이션)
                const bgGradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                bgGradient.addColorStop(0, 'rgba(20, 20, 40, 0.95)');
                bgGradient.addColorStop(1, 'rgba(30, 30, 50, 0.95)');
                this.ctx.fillStyle = bgGradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 그리드 그리기 (더 부드럽게)
                this.ctx.strokeStyle = 'rgba(102, 126, 234, 0.08)';
                this.ctx.lineWidth = 1;
                for (let i = 0; i <= COLS; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * BLOCK_SIZE, 0);
                    this.ctx.lineTo(i * BLOCK_SIZE, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let i = 0; i <= ROWS; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * BLOCK_SIZE);
                    this.ctx.lineTo(this.canvas.width, i * BLOCK_SIZE);
                    this.ctx.stroke();
                }

                // 보드 그리기
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (this.board[y][x]) {
                            this.drawBlock(this.ctx, x, y, COLORS[this.board[y][x]]);
                        }
                    }
                }

                // 현재 조각 그리기
                if (this.currentPiece) {
                    for (let y = 0; y < this.currentPiece.shape.length; y++) {
                        for (let x = 0; x < this.currentPiece.shape[y].length; x++) {
                            if (this.currentPiece.shape[y][x]) {
                                this.drawBlock(
                                    this.ctx,
                                    this.currentPiece.x + x,
                                    this.currentPiece.y + y,
                                    COLORS[this.currentPiece.color]
                                );
                            }
                        }
                    }

                    // 고스트 조각 (착지 위치 표시)
                    this.drawGhost();
                }
            }

            drawGhost() {
                const ghost = {
                    ...this.currentPiece,
                    y: this.currentPiece.y
                };

                while (!this.collides(ghost)) {
                    ghost.y++;
                }
                ghost.y--;

                // 고스트 블록을 더 세련된 아웃라인으로 표시
                for (let y = 0; y < ghost.shape.length; y++) {
                    for (let x = 0; x < ghost.shape[y].length; x++) {
                        if (ghost.shape[y][x]) {
                            const px = (ghost.x + x) * BLOCK_SIZE;
                            const py = (ghost.y + y) * BLOCK_SIZE;

                            // 반투명 채우기
                            this.ctx.fillStyle = COLORS[ghost.color] + '20';
                            this.ctx.fillRect(px, py, BLOCK_SIZE, BLOCK_SIZE);

                            // 밝은 테두리
                            this.ctx.strokeStyle = COLORS[ghost.color] + '60';
                            this.ctx.lineWidth = 2;
                            this.ctx.strokeRect(px + 1, py + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                        }
                    }
                }
            }

            drawNext() {
                // 그라데이션 배경
                const bgGradient = this.nextCtx.createLinearGradient(0, 0, 0, this.nextCanvas.height);
                bgGradient.addColorStop(0, 'rgba(20, 20, 40, 0.6)');
                bgGradient.addColorStop(1, 'rgba(30, 30, 50, 0.6)');
                this.nextCtx.fillStyle = bgGradient;
                this.nextCtx.fillRect(0, 0, this.nextCanvas.width, this.nextCanvas.height);

                if (this.nextPiece) {
                    const size = 20;
                    const offsetX = (this.nextCanvas.width - this.nextPiece.shape[0].length * size) / 2;
                    const offsetY = (this.nextCanvas.height - this.nextPiece.shape.length * size) / 2;

                    for (let y = 0; y < this.nextPiece.shape.length; y++) {
                        for (let x = 0; x < this.nextPiece.shape[y].length; x++) {
                            if (this.nextPiece.shape[y][x]) {
                                const drawX = offsetX / size + x;
                                const drawY = offsetY / size + y;
                                this.drawBlock(
                                    this.nextCtx,
                                    drawX,
                                    drawY,
                                    COLORS[this.nextPiece.color],
                                    size
                                );
                            }
                        }
                    }
                }
            }

            updateScore() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('level').textContent = this.level;
                document.getElementById('lines').textContent = this.lines;
            }

            animate(time = 0) {
                if (this.gameOver) return;

                const deltaTime = time - this.lastTime;
                this.lastTime = time;

                if (!this.isPaused) {
                    this.dropCounter += deltaTime;
                    if (this.dropCounter > this.dropInterval) {
                        this.drop();
                    }
                }

                this.draw();
                requestAnimationFrame((t) => this.animate(t));
            }

            endGame() {
                this.gameOver = true;
                document.getElementById('gameOverOverlay').classList.add('show');
            }

            restart() {
                this.board = this.createBoard();
                this.score = 0;
                this.lines = 0;
                this.level = 1;
                this.gameOver = false;
                this.isPaused = false;
                this.dropCounter = 0;
                this.dropInterval = 1000;

                document.getElementById('gameOverOverlay').classList.remove('show');

                this.nextPiece = this.createPiece();
                this.currentPiece = this.createPiece();
                this.updateScore();
                this.drawNext();
                this.lastTime = performance.now();
                this.animate(this.lastTime);
            }

            togglePause() {
                this.isPaused = !this.isPaused;
            }

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameOver && e.code === 'Space') {
                        this.restart();
                        return;
                    }

                    if (this.gameOver || this.isPaused) return;

                    switch(e.code) {
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.move(-1);
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.move(1);
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            this.drop();
                            break;
                        case 'ArrowUp':
                            e.preventDefault();
                            this.rotate(this.currentPiece);
                            break;
                        case 'Space':
                            e.preventDefault();
                            this.hardDrop();
                            break;
                        case 'KeyP':
                            e.preventDefault();
                            this.togglePause();
                            break;
                    }

                    this.draw();
                });
            }
        }

        // 게임 시작
        const game = new Tetris();
    </script>
</body>
</html>
