<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 - TETRIS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
        }

        .game-container {
            background: #0f0f23;
            border: 4px solid #ff6b6b;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5),
                        inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-title {
            font-size: 48px;
            font-weight: bold;
            color: #ff6b6b;
            text-shadow: 0 0 10px #ff6b6b,
                         0 0 20px #ff6b6b,
                         0 0 30px #ff6b6b;
            letter-spacing: 10px;
            margin-bottom: 10px;
        }

        .game-content {
            display: flex;
            gap: 20px;
        }

        .game-board-container {
            position: relative;
        }

        #gameCanvas {
            border: 3px solid #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.5),
                        inset 0 0 10px rgba(0, 0, 0, 0.8);
            background: #000;
            image-rendering: pixelated;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 200px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #4ecdc4;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
        }

        .info-title {
            color: #4ecdc4;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 0 0 5px #4ecdc4;
        }

        .info-value {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 5px #fff;
        }

        #nextCanvas {
            border: 2px solid #4ecdc4;
            background: #000;
            margin: 10px auto;
            display: block;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
        }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ff6b6b;
            border-radius: 5px;
            padding: 15px;
            font-size: 12px;
            line-height: 1.8;
        }

        .controls h3 {
            color: #ff6b6b;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #ff6b6b;
        }

        .control-item {
            color: #fff;
            margin: 5px 0;
        }

        .control-key {
            color: #4ecdc4;
            font-weight: bold;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-text {
            font-size: 48px;
            color: #ff6b6b;
            font-weight: bold;
            text-shadow: 0 0 20px #ff6b6b;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }

        .restart-text {
            font-size: 20px;
            color: #4ecdc4;
            text-shadow: 0 0 10px #4ecdc4;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
            font-family: 'Courier New', monospace;
        }

        .button:hover {
            background: linear-gradient(135deg, #ee5a6f 0%, #ff6b6b 100%);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
        }

        .button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="game-title">TETRIS</div>
        </div>

        <div class="game-content">
            <div class="game-board-container">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <div class="game-over-overlay" id="gameOverOverlay">
                    <div class="game-over-text">GAME OVER</div>
                    <div class="restart-text">SPACE 키를 눌러 다시 시작</div>
                </div>
            </div>

            <div class="side-panel">
                <div class="info-box">
                    <div class="info-title">점수</div>
                    <div class="info-value" id="score">0</div>
                </div>

                <div class="info-box">
                    <div class="info-title">레벨</div>
                    <div class="info-value" id="level">1</div>
                </div>

                <div class="info-box">
                    <div class="info-title">라인</div>
                    <div class="info-value" id="lines">0</div>
                </div>

                <div class="info-box">
                    <div class="info-title">다음 블록</div>
                    <canvas id="nextCanvas" width="120" height="120"></canvas>
                </div>

                <div class="controls">
                    <h3>조작법</h3>
                    <div class="control-item"><span class="control-key">←/→</span> 좌우 이동</div>
                    <div class="control-item"><span class="control-key">↑</span> 회전</div>
                    <div class="control-item"><span class="control-key">↓</span> 빠른 낙하</div>
                    <div class="control-item"><span class="control-key">SPACE</span> 즉시 낙하</div>
                    <div class="control-item"><span class="control-key">P</span> 일시정지</div>
                </div>

                <button class="button" onclick="game.restart()">새 게임</button>
            </div>
        </div>
    </div>

    <script>
        // 게임 상수
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        const COLORS = [
            null,
            '#FF0D72', // I - 밝은 핑크
            '#0DC2FF', // J - 밝은 청록
            '#FF971C', // L - 주황
            '#FFD700', // O - 금색
            '#0FFF50', // S - 네온 그린
            '#F538FF', // T - 보라
            '#FF3F3F'  // Z - 빨강
        ];

        // 테트로미노 모양 정의
        const SHAPES = [
            [], // 0은 빈 공간
            [[1,1,1,1]], // I
            [[1,0,0],[1,1,1]], // J
            [[0,0,1],[1,1,1]], // L
            [[1,1],[1,1]], // O
            [[0,1,1],[1,1,0]], // S
            [[0,1,0],[1,1,1]], // T
            [[1,1,0],[0,1,1]]  // Z
        ];

        class Tetris {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.nextCanvas = document.getElementById('nextCanvas');
                this.nextCtx = this.nextCanvas.getContext('2d');

                this.board = this.createBoard();
                this.score = 0;
                this.lines = 0;
                this.level = 1;
                this.gameOver = false;
                this.isPaused = false;

                this.currentPiece = null;
                this.nextPiece = null;

                this.dropCounter = 0;
                this.dropInterval = 1000;
                this.lastTime = 0;

                this.setupControls();
                this.init();
            }

            createBoard() {
                return Array(ROWS).fill().map(() => Array(COLS).fill(0));
            }

            init() {
                this.nextPiece = this.createPiece();
                this.currentPiece = this.createPiece();
                this.updateScore();
                this.draw();
                this.animate(0);
            }

            createPiece() {
                const type = Math.floor(Math.random() * 7) + 1;
                return {
                    shape: SHAPES[type],
                    color: type,
                    x: Math.floor(COLS / 2) - Math.floor(SHAPES[type][0].length / 2),
                    y: 0
                };
            }

            rotate(piece) {
                const rotated = [];
                const N = piece.shape.length;
                const M = piece.shape[0].length;

                for (let i = 0; i < M; i++) {
                    rotated[i] = [];
                    for (let j = 0; j < N; j++) {
                        rotated[i][j] = piece.shape[N - 1 - j][i];
                    }
                }

                const oldShape = piece.shape;
                piece.shape = rotated;

                // 회전 후 벽 충돌 체크 및 조정
                let offset = 1;
                while (this.collides(piece)) {
                    piece.x += offset;
                    offset = -(offset + (offset > 0 ? 1 : -1));
                    if (offset > piece.shape[0].length) {
                        piece.shape = oldShape;
                        return;
                    }
                }
            }

            collides(piece) {
                for (let y = 0; y < piece.shape.length; y++) {
                    for (let x = 0; x < piece.shape[y].length; x++) {
                        if (piece.shape[y][x]) {
                            const newX = piece.x + x;
                            const newY = piece.y + y;

                            if (newX < 0 || newX >= COLS || newY >= ROWS) {
                                return true;
                            }

                            if (newY >= 0 && this.board[newY][newX]) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            merge() {
                for (let y = 0; y < this.currentPiece.shape.length; y++) {
                    for (let x = 0; x < this.currentPiece.shape[y].length; x++) {
                        if (this.currentPiece.shape[y][x]) {
                            const boardY = this.currentPiece.y + y;
                            const boardX = this.currentPiece.x + x;
                            if (boardY >= 0) {
                                this.board[boardY][boardX] = this.currentPiece.color;
                            }
                        }
                    }
                }
            }

            clearLines() {
                let linesCleared = 0;

                outer: for (let y = ROWS - 1; y >= 0; y--) {
                    for (let x = 0; x < COLS; x++) {
                        if (!this.board[y][x]) {
                            continue outer;
                        }
                    }

                    // 라인 삭제 애니메이션 효과
                    const row = this.board.splice(y, 1)[0].fill(0);
                    this.board.unshift(row);
                    linesCleared++;
                    y++;
                }

                if (linesCleared > 0) {
                    this.lines += linesCleared;
                    // 점수 계산 (테트리스 오리지널 방식)
                    const points = [0, 100, 300, 500, 800];
                    this.score += points[linesCleared] * this.level;

                    // 10라인마다 레벨업
                    this.level = Math.floor(this.lines / 10) + 1;
                    this.dropInterval = 1000 - (this.level - 1) * 100;
                    if (this.dropInterval < 100) this.dropInterval = 100;

                    this.updateScore();
                }
            }

            move(dir) {
                this.currentPiece.x += dir;
                if (this.collides(this.currentPiece)) {
                    this.currentPiece.x -= dir;
                }
            }

            drop() {
                this.currentPiece.y++;
                if (this.collides(this.currentPiece)) {
                    this.currentPiece.y--;
                    this.merge();
                    this.clearLines();
                    this.currentPiece = this.nextPiece;
                    this.nextPiece = this.createPiece();

                    if (this.collides(this.currentPiece)) {
                        this.endGame();
                    }

                    this.drawNext();
                }
                this.dropCounter = 0;
            }

            hardDrop() {
                while (!this.collides(this.currentPiece)) {
                    this.currentPiece.y++;
                }
                this.currentPiece.y--;
                this.drop();
            }

            drawBlock(ctx, x, y, color, size = BLOCK_SIZE) {
                ctx.fillStyle = color;
                ctx.fillRect(x * size, y * size, size, size);

                // 3D 효과
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x * size, y * size, size, size);

                // 하이라이트
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(x * size, y * size, size / 4, size / 4);

                // 그림자
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(x * size + size * 0.75, y * size + size * 0.75, size / 4, size / 4);
            }

            draw() {
                // 배경 그리기
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 그리드 그리기
                this.ctx.strokeStyle = 'rgba(78, 205, 196, 0.1)';
                this.ctx.lineWidth = 1;
                for (let i = 0; i <= COLS; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * BLOCK_SIZE, 0);
                    this.ctx.lineTo(i * BLOCK_SIZE, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let i = 0; i <= ROWS; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * BLOCK_SIZE);
                    this.ctx.lineTo(this.canvas.width, i * BLOCK_SIZE);
                    this.ctx.stroke();
                }

                // 보드 그리기
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (this.board[y][x]) {
                            this.drawBlock(this.ctx, x, y, COLORS[this.board[y][x]]);
                        }
                    }
                }

                // 현재 조각 그리기
                if (this.currentPiece) {
                    for (let y = 0; y < this.currentPiece.shape.length; y++) {
                        for (let x = 0; x < this.currentPiece.shape[y].length; x++) {
                            if (this.currentPiece.shape[y][x]) {
                                this.drawBlock(
                                    this.ctx,
                                    this.currentPiece.x + x,
                                    this.currentPiece.y + y,
                                    COLORS[this.currentPiece.color]
                                );
                            }
                        }
                    }

                    // 고스트 조각 (착지 위치 표시)
                    this.drawGhost();
                }
            }

            drawGhost() {
                const ghost = {
                    ...this.currentPiece,
                    y: this.currentPiece.y
                };

                while (!this.collides(ghost)) {
                    ghost.y++;
                }
                ghost.y--;

                this.ctx.globalAlpha = 0.2;
                for (let y = 0; y < ghost.shape.length; y++) {
                    for (let x = 0; x < ghost.shape[y].length; x++) {
                        if (ghost.shape[y][x]) {
                            this.drawBlock(
                                this.ctx,
                                ghost.x + x,
                                ghost.y + y,
                                COLORS[ghost.color]
                            );
                        }
                    }
                }
                this.ctx.globalAlpha = 1;
            }

            drawNext() {
                this.nextCtx.fillStyle = '#000';
                this.nextCtx.fillRect(0, 0, this.nextCanvas.width, this.nextCanvas.height);

                if (this.nextPiece) {
                    const size = 20;
                    const offsetX = (this.nextCanvas.width - this.nextPiece.shape[0].length * size) / 2;
                    const offsetY = (this.nextCanvas.height - this.nextPiece.shape.length * size) / 2;

                    for (let y = 0; y < this.nextPiece.shape.length; y++) {
                        for (let x = 0; x < this.nextPiece.shape[y].length; x++) {
                            if (this.nextPiece.shape[y][x]) {
                                const drawX = offsetX / size + x;
                                const drawY = offsetY / size + y;
                                this.drawBlock(
                                    this.nextCtx,
                                    drawX,
                                    drawY,
                                    COLORS[this.nextPiece.color],
                                    size
                                );
                            }
                        }
                    }
                }
            }

            updateScore() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('level').textContent = this.level;
                document.getElementById('lines').textContent = this.lines;
            }

            animate(time = 0) {
                if (this.gameOver) return;

                const deltaTime = time - this.lastTime;
                this.lastTime = time;

                if (!this.isPaused) {
                    this.dropCounter += deltaTime;
                    if (this.dropCounter > this.dropInterval) {
                        this.drop();
                    }
                }

                this.draw();
                requestAnimationFrame((t) => this.animate(t));
            }

            endGame() {
                this.gameOver = true;
                document.getElementById('gameOverOverlay').classList.add('show');
            }

            restart() {
                this.board = this.createBoard();
                this.score = 0;
                this.lines = 0;
                this.level = 1;
                this.gameOver = false;
                this.isPaused = false;
                this.dropCounter = 0;
                this.dropInterval = 1000;

                document.getElementById('gameOverOverlay').classList.remove('show');

                this.nextPiece = this.createPiece();
                this.currentPiece = this.createPiece();
                this.updateScore();
                this.drawNext();
                this.lastTime = performance.now();
                this.animate(this.lastTime);
            }

            togglePause() {
                this.isPaused = !this.isPaused;
            }

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameOver && e.code === 'Space') {
                        this.restart();
                        return;
                    }

                    if (this.gameOver || this.isPaused) return;

                    switch(e.code) {
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.move(-1);
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.move(1);
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            this.drop();
                            break;
                        case 'ArrowUp':
                            e.preventDefault();
                            this.rotate(this.currentPiece);
                            break;
                        case 'Space':
                            e.preventDefault();
                            this.hardDrop();
                            break;
                        case 'KeyP':
                            e.preventDefault();
                            this.togglePause();
                            break;
                    }

                    this.draw();
                });
            }
        }

        // 게임 시작
        const game = new Tetris();
    </script>
</body>
</html>
