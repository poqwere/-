<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탕탕 서바이버 - Vampire Survivors Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
        }

        /* CRT 스캔라인 효과 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
        }

        .game-container {
            background: rgba(15, 15, 35, 0.95);
            border: 4px solid #ff6b00;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.6),
                        inset 0 0 30px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 2;
        }

        .game-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: rgba(255, 107, 0, 0.1);
            border: 2px solid #ff6b00;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #ffaa66;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff6b00;
        }

        .exp-bar-container {
            width: 100%;
            height: 20px;
            background: #333;
            border: 2px solid #00ff00;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .exp-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00cc00);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00ff00;
        }

        .hp-bar-container {
            width: 100%;
            height: 20px;
            background: #333;
            border: 2px solid #ff0000;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .hp-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #cc0000);
            width: 100%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #ff0000;
        }

        #gameCanvas {
            display: block;
            border: 3px solid #00ffff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5),
                        inset 0 0 20px rgba(0, 0, 0, 0.5);
            background: #0a0a0a;
        }

        .game-controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            background: linear-gradient(145deg, #ff6b00, #cc5500);
            color: #fff;
            border: 2px solid #ff6b00;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.6);
            background: linear-gradient(145deg, #ff7b10, #dd6500);
        }

        button:active {
            transform: translateY(0);
        }

        .title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #ff6b00, 0 0 40px #00ffff;
            letter-spacing: 4px;
        }

        .instructions {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #ffaa66;
            text-shadow: 0 0 5px #ff6b00;
        }

        /* 레벨업 선택 화면 */
        #levelUpScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.98);
            padding: 30px;
            border: 4px solid #ffaa00;
            border-radius: 15px;
            z-index: 100;
            box-shadow: 0 0 50px rgba(255, 170, 0, 0.8);
            min-width: 500px;
        }

        #levelUpScreen h2 {
            text-align: center;
            font-size: 36px;
            color: #ffaa00;
            text-shadow: 0 0 20px #ffaa00;
            margin-bottom: 20px;
        }

        .skill-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .skill-card {
            background: rgba(50, 50, 100, 0.9);
            border: 3px solid #00ffff;
            border-radius: 10px;
            padding: 20px;
            width: 140px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .skill-card:hover {
            transform: scale(1.05);
            border-color: #ffaa00;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.8);
        }

        .skill-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .skill-name {
            font-size: 16px;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 8px;
        }

        .skill-level {
            font-size: 12px;
            color: #ffaa00;
            margin-bottom: 8px;
        }

        .skill-desc {
            font-size: 11px;
            color: #aaa;
            line-height: 1.3;
        }

        /* 게임 오버 */
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 4px solid #ff0000;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
        }

        #gameOver h2 {
            font-size: 48px;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
            margin-bottom: 20px;
        }

        #gameOver p {
            font-size: 20px;
            margin: 10px 0;
            color: #00ffff;
        }

        /* 승리 화면 */
        #victoryScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 4px solid #00ff00;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.8);
        }

        #victoryScreen h2 {
            font-size: 48px;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
            margin-bottom: 20px;
        }

        #victoryScreen p {
            font-size: 20px;
            margin: 10px 0;
            color: #ffaa00;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="title">🧛 탕탕 서바이버 🧛</div>

        <div class="game-header">
            <div class="stat-box">
                <div class="stat-label">생존 시간</div>
                <div class="stat-value" id="timer">00:00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">레벨 <span id="level">1</span></div>
                <div class="exp-bar-container">
                    <div class="exp-bar" id="expBar"></div>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-label">HP</div>
                <div class="hp-bar-container">
                    <div class="hp-bar" id="hpBar"></div>
                </div>
            </div>
        </div>

        <div class="stat-box" style="margin-bottom: 15px;">
            <div class="stat-label">처치 수: <span id="killCount" class="stat-value">0</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="game-controls">
            <button id="startBtn">게임 시작</button>
            <button id="pauseBtn">일시정지</button>
        </div>

        <div class="instructions">
            WASD 또는 방향키로 이동 | 자동 공격 | 경험치를 모아 레벨업!
        </div>

        <!-- 레벨업 화면 -->
        <div id="levelUpScreen">
            <h2>⬆️ 레벨업!</h2>
            <div class="skill-options" id="skillOptions"></div>
        </div>

        <!-- 게임 오버 -->
        <div id="gameOver">
            <h2>💀 게임 오버!</h2>
            <p>생존 시간: <span id="finalTime">00:00</span></p>
            <p>처치 수: <span id="finalKills">0</span></p>
            <p>레벨: <span id="finalLevel">1</span></p>
            <button id="restartBtn">다시 시작</button>
        </div>

        <!-- 승리 화면 -->
        <div id="victoryScreen">
            <h2>🎉 승리!</h2>
            <p>15분 생존 성공!</p>
            <p>처치 수: <span id="victoryKills">0</span></p>
            <p>최종 레벨: <span id="victoryLevel">1</span></p>
            <button id="victoryRestartBtn">다시 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 게임 상태
        const gameState = {
            running: false,
            paused: false,
            time: 0,
            maxTime: 15 * 60, // 15분 = 900초
            level: 1,
            exp: 0,
            expToNext: 10,
            hp: 100,
            maxHp: 100,
            kills: 0,
            damage: 10,
            moveSpeed: 3
        };

        // 플레이어
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 20,
            speed: 3,
            color: '#00ff00'
        };

        // 키보드 입력
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // 배열들
        let enemies = [];
        let projectiles = [];
        let expOrbs = [];
        let particles = [];

        // 무기 시스템
        const weapons = [];

        // 무기 정의
        const weaponTypes = {
            orbit: {
                name: '마법서',
                icon: '📖',
                desc: '주변을 회전하는 마법서',
                maxLevel: 8,
                update: function(weapon) {
                    weapon.angle += weapon.speed;
                    weapon.x = player.x + Math.cos(weapon.angle) * weapon.radius;
                    weapon.y = player.y + Math.sin(weapon.angle) * weapon.radius;
                },
                draw: function(weapon) {
                    ctx.save();
                    ctx.translate(weapon.x, weapon.y);
                    ctx.rotate(weapon.angle);
                    ctx.fillStyle = '#aa00ff';
                    ctx.shadowColor = '#aa00ff';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(-weapon.size / 2, -weapon.size / 2, weapon.size, weapon.size);
                    ctx.restore();
                },
                upgrade: function(weapon) {
                    weapon.level++;
                    weapon.damage += 5;
                    weapon.size += 2;
                }
            },
            fireball: {
                name: '화염구',
                icon: '🔥',
                desc: '가장 가까운 적에게 발사',
                maxLevel: 8,
                cooldown: 60,
                update: function(weapon) {
                    weapon.timer++;
                    if (weapon.timer >= weapon.cooldown) {
                        const nearestEnemy = findNearestEnemy();
                        if (nearestEnemy) {
                            shootFireball(nearestEnemy);
                            weapon.timer = 0;
                        }
                    }
                },
                draw: function(weapon) {},
                upgrade: function(weapon) {
                    weapon.level++;
                    weapon.damage += 8;
                    weapon.cooldown = Math.max(20, weapon.cooldown - 5);
                }
            },
            lightning: {
                name: '번개',
                icon: '⚡',
                desc: '랜덤 적에게 번개 공격',
                maxLevel: 8,
                cooldown: 90,
                update: function(weapon) {
                    weapon.timer++;
                    if (weapon.timer >= weapon.cooldown) {
                        const randomEnemy = enemies[Math.floor(Math.random() * enemies.length)];
                        if (randomEnemy) {
                            strikeLightning(randomEnemy, weapon.damage);
                            weapon.timer = 0;
                        }
                    }
                },
                draw: function(weapon) {},
                upgrade: function(weapon) {
                    weapon.level++;
                    weapon.damage += 12;
                    weapon.cooldown = Math.max(30, weapon.cooldown - 8);
                }
            },
            garlic: {
                name: '마늘 오라',
                icon: '🧄',
                desc: '주변 적에게 지속 피해',
                maxLevel: 8,
                update: function(weapon) {
                    weapon.timer++;
                    if (weapon.timer >= 30) {
                        enemies.forEach(enemy => {
                            const dist = distance(player, enemy);
                            if (dist < weapon.radius) {
                                damageEnemy(enemy, weapon.damage / 10);
                            }
                        });
                        weapon.timer = 0;
                    }
                },
                draw: function(weapon) {
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, weapon.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 200, 0, 0.3)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                },
                upgrade: function(weapon) {
                    weapon.level++;
                    weapon.damage += 3;
                    weapon.radius += 10;
                }
            }
        };

        // 적 클래스
        class Enemy {
            constructor(isBoss = false) {
                this.isBoss = isBoss;
                this.size = isBoss ? 40 : 15;

                // 화면 밖에서 스폰
                const side = Math.floor(Math.random() * 4);
                if (side === 0) { // 위
                    this.x = Math.random() * canvas.width;
                    this.y = -this.size;
                } else if (side === 1) { // 오른쪽
                    this.x = canvas.width + this.size;
                    this.y = Math.random() * canvas.height;
                } else if (side === 2) { // 아래
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + this.size;
                } else { // 왼쪽
                    this.x = -this.size;
                    this.y = Math.random() * canvas.height;
                }

                this.speed = isBoss ? 0.8 : (1 + Math.random() * 0.5 + gameState.time / 300);
                this.hp = isBoss ? 500 : (10 + Math.floor(gameState.time / 60) * 5);
                this.maxHp = this.hp;
                this.damage = isBoss ? 20 : 10;
                this.color = isBoss ? '#ff0000' : '#ff00ff';
                this.expValue = isBoss ? 50 : 1;
            }

            update() {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }

                // 플레이어와 충돌 체크
                if (dist < this.size + player.size) {
                    damagePlayer(this.damage);
                }
            }

            draw() {
                ctx.shadowColor = this.color;
                ctx.shadowBlur = this.isBoss ? 20 : 10;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // HP 바 (보스용)
                if (this.isBoss) {
                    const barWidth = this.size * 2;
                    const barHeight = 5;
                    ctx.fillStyle = '#333';
                    ctx.fillRect(this.x - barWidth / 2, this.y - this.size - 10, barWidth, barHeight);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(this.x - barWidth / 2, this.y - this.size - 10, barWidth * (this.hp / this.maxHp), barHeight);
                }

                ctx.shadowBlur = 0;
            }
        }

        // 경험치 구슬 클래스
        class ExpOrb {
            constructor(x, y, value = 1) {
                this.x = x;
                this.y = y;
                this.size = 6;
                this.value = value;
                this.color = value > 1 ? '#ffaa00' : '#00ff00';
            }

            update() {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // 플레이어 근처에서 끌어당김
                if (dist < 100) {
                    const pullSpeed = 5;
                    this.x += (dx / dist) * pullSpeed;
                    this.y += (dy / dist) * pullSpeed;
                }

                // 플레이어와 충돌 시 수집
                if (dist < player.size) {
                    collectExp(this.value);
                    return true; // 제거 표시
                }
                return false;
            }

            draw() {
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // 파티클 클래스
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.life = 30;
                this.maxLife = 30;
                this.color = color;
                this.size = Math.random() * 3 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw() {
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // 유틸리티 함수들
        function distance(obj1, obj2) {
            const dx = obj1.x - obj2.x;
            const dy = obj1.y - obj2.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function findNearestEnemy() {
            let nearest = null;
            let minDist = Infinity;
            enemies.forEach(enemy => {
                const dist = distance(player, enemy);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = enemy;
                }
            });
            return nearest;
        }

        function shootFireball(target) {
            const dx = target.x - player.x;
            const dy = target.y - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            projectiles.push({
                x: player.x,
                y: player.y,
                vx: (dx / dist) * 8,
                vy: (dy / dist) * 8,
                size: 8,
                damage: 30,
                color: '#ff6600',
                life: 100
            });
        }

        function strikeLightning(target, damage) {
            damageEnemy(target, damage);
            // 번개 이펙트
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(target.x, target.y, '#ffff00'));
            }
        }

        function damageEnemy(enemy, damage) {
            enemy.hp -= damage;
            if (enemy.hp <= 0) {
                killEnemy(enemy);
            }
        }

        function killEnemy(enemy) {
            const index = enemies.indexOf(enemy);
            if (index > -1) {
                enemies.splice(index, 1);
                gameState.kills++;
                document.getElementById('killCount').textContent = gameState.kills;

                // 경험치 드롭
                expOrbs.push(new ExpOrb(enemy.x, enemy.y, enemy.expValue));

                // 파티클
                for (let i = 0; i < 10; i++) {
                    particles.push(new Particle(enemy.x, enemy.y, enemy.color));
                }
            }
        }

        function damagePlayer(damage) {
            gameState.hp -= damage;
            if (gameState.hp <= 0) {
                gameState.hp = 0;
                gameOver();
            }
            updateHPBar();
        }

        function collectExp(value) {
            gameState.exp += value;
            if (gameState.exp >= gameState.expToNext) {
                levelUp();
            }
            updateExpBar();
        }

        function levelUp() {
            gameState.level++;
            gameState.exp -= gameState.expToNext;
            gameState.expToNext = Math.floor(gameState.expToNext * 1.2);
            document.getElementById('level').textContent = gameState.level;

            showLevelUpScreen();
        }

        function showLevelUpScreen() {
            gameState.paused = true;
            const screen = document.getElementById('levelUpScreen');
            const optionsDiv = document.getElementById('skillOptions');
            optionsDiv.innerHTML = '';

            // 사용 가능한 무기/업그레이드 목록
            const availableSkills = [];

            // 기존 무기 업그레이드
            weapons.forEach(weapon => {
                if (weapon.level < weapon.maxLevel) {
                    availableSkills.push({
                        type: 'upgrade',
                        weapon: weapon,
                        name: weapon.name,
                        icon: weapon.icon,
                        level: weapon.level,
                        desc: `레벨 ${weapon.level + 1}로 업그레이드`
                    });
                }
            });

            // 새 무기 추가 (아직 없는 것만)
            Object.keys(weaponTypes).forEach(key => {
                const hasWeapon = weapons.some(w => w.type === key);
                if (!hasWeapon) {
                    availableSkills.push({
                        type: 'new',
                        weaponType: key,
                        name: weaponTypes[key].name,
                        icon: weaponTypes[key].icon,
                        level: 0,
                        desc: weaponTypes[key].desc
                    });
                }
            });

            // 랜덤하게 3개 선택
            const selectedSkills = [];
            while (selectedSkills.length < 3 && availableSkills.length > 0) {
                const index = Math.floor(Math.random() * availableSkills.length);
                selectedSkills.push(availableSkills[index]);
                availableSkills.splice(index, 1);
            }

            // 스킬 카드 생성
            selectedSkills.forEach(skill => {
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.innerHTML = `
                    <div class="skill-icon">${skill.icon}</div>
                    <div class="skill-name">${skill.name}</div>
                    <div class="skill-level">Lv ${skill.level} → ${skill.level + 1}</div>
                    <div class="skill-desc">${skill.desc}</div>
                `;
                card.onclick = () => selectSkill(skill);
                optionsDiv.appendChild(card);
            });

            screen.style.display = 'block';
        }

        function selectSkill(skill) {
            if (skill.type === 'upgrade') {
                // 기존 무기 업그레이드
                const weaponDef = weaponTypes[skill.weapon.type];
                weaponDef.upgrade(skill.weapon);
            } else if (skill.type === 'new') {
                // 새 무기 추가
                addWeapon(skill.weaponType);
            }

            document.getElementById('levelUpScreen').style.display = 'none';
            gameState.paused = false;
        }

        function addWeapon(type) {
            const weaponDef = weaponTypes[type];
            const weapon = {
                type: type,
                name: weaponDef.name,
                icon: weaponDef.icon,
                level: 1,
                damage: 20,
                timer: 0,
                cooldown: weaponDef.cooldown || 0,
                // 오빗 전용
                angle: weapons.length * (Math.PI / 2),
                radius: 60 + weapons.length * 20,
                size: 15,
                speed: 0.05,
                maxLevel: weaponDef.maxLevel
            };
            weapons.push(weapon);
        }

        function updateExpBar() {
            const percent = (gameState.exp / gameState.expToNext) * 100;
            document.getElementById('expBar').style.width = percent + '%';
        }

        function updateHPBar() {
            const percent = (gameState.hp / gameState.maxHp) * 100;
            document.getElementById('hpBar').style.width = percent + '%';
        }

        function updateTimer() {
            if (!gameState.running || gameState.paused) return;

            gameState.time++;
            const minutes = Math.floor(gameState.time / 60);
            const seconds = gameState.time % 60;
            document.getElementById('timer').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // 보스 스폰 (5분, 10분, 15분)
            if (gameState.time === 300 || gameState.time === 600 || gameState.time === 900) {
                enemies.push(new Enemy(true));
            }

            // 승리 조건
            if (gameState.time >= gameState.maxTime) {
                victory();
            }
        }

        // 별 배경
        const stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2
            });
        }

        function drawStars() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        // 게임 업데이트
        function update() {
            if (!gameState.running || gameState.paused) return;

            // 플레이어 이동
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= 1;
            if (keys['s'] || keys['arrowdown']) dy += 1;
            if (keys['a'] || keys['arrowleft']) dx -= 1;
            if (keys['d'] || keys['arrowright']) dx += 1;

            // 정규화
            if (dx !== 0 || dy !== 0) {
                const length = Math.sqrt(dx * dx + dy * dy);
                player.x += (dx / length) * player.speed;
                player.y += (dy / length) * player.speed;
            }

            // 경계 체크
            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

            // 적 스폰
            if (Math.random() < 0.02 + gameState.time / 10000) {
                enemies.push(new Enemy());
            }

            // 적 업데이트
            enemies.forEach(enemy => enemy.update());

            // 무기 업데이트
            weapons.forEach(weapon => {
                const weaponDef = weaponTypes[weapon.type];
                weaponDef.update(weapon);
            });

            // 투사체 업데이트
            projectiles.forEach((proj, index) => {
                proj.x += proj.vx;
                proj.y += proj.vy;
                proj.life--;

                if (proj.life <= 0) {
                    projectiles.splice(index, 1);
                    return;
                }

                // 적과 충돌 체크
                enemies.forEach(enemy => {
                    if (distance(proj, enemy) < enemy.size + proj.size) {
                        damageEnemy(enemy, proj.damage);
                        projectiles.splice(index, 1);
                    }
                });
            });

            // 오빗 무기와 적 충돌
            weapons.forEach(weapon => {
                if (weapon.type === 'orbit') {
                    enemies.forEach(enemy => {
                        const dist = Math.sqrt((weapon.x - enemy.x) ** 2 + (weapon.y - enemy.y) ** 2);
                        if (dist < weapon.size / 2 + enemy.size) {
                            damageEnemy(enemy, weapon.damage);
                        }
                    });
                }
            });

            // 경험치 구슬 업데이트
            expOrbs = expOrbs.filter(orb => !orb.update());

            // 파티클 업데이트
            particles = particles.filter(p => {
                p.update();
                return p.life > 0;
            });
        }

        // 게임 그리기
        function draw() {
            // 배경
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 별
            drawStars();

            // 경험치 구슬
            expOrbs.forEach(orb => orb.draw());

            // 플레이어
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 20;
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 무기
            weapons.forEach(weapon => {
                const weaponDef = weaponTypes[weapon.type];
                weaponDef.draw(weapon);
            });

            // 투사체
            projectiles.forEach(proj => {
                ctx.shadowColor = proj.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = proj.color;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, proj.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 적
            enemies.forEach(enemy => enemy.draw());

            // 파티클
            particles.forEach(p => p.draw());
        }

        // 게임 루프
        let lastTime = 0;
        function gameLoop(timestamp) {
            if (timestamp - lastTime >= 1000) {
                updateTimer();
                lastTime = timestamp;
            }

            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 게임 시작
        function startGame() {
            gameState.running = true;
            gameState.paused = false;
            gameState.time = 0;
            gameState.level = 1;
            gameState.exp = 0;
            gameState.expToNext = 10;
            gameState.hp = 100;
            gameState.maxHp = 100;
            gameState.kills = 0;

            player.x = canvas.width / 2;
            player.y = canvas.height / 2;

            enemies = [];
            projectiles = [];
            expOrbs = [];
            particles = [];
            weapons.length = 0;

            // 시작 무기
            addWeapon('orbit');

            document.getElementById('timer').textContent = '00:00';
            document.getElementById('level').textContent = '1';
            document.getElementById('killCount').textContent = '0';
            updateExpBar();
            updateHPBar();

            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('victoryScreen').style.display = 'none';
            document.getElementById('pauseBtn').textContent = '일시정지';
        }

        function togglePause() {
            if (!gameState.running) return;
            gameState.paused = !gameState.paused;
            document.getElementById('pauseBtn').textContent = gameState.paused ? '계속하기' : '일시정지';
        }

        function gameOver() {
            gameState.running = false;
            const minutes = Math.floor(gameState.time / 60);
            const seconds = gameState.time % 60;
            document.getElementById('finalTime').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('finalKills').textContent = gameState.kills;
            document.getElementById('finalLevel').textContent = gameState.level;
            document.getElementById('gameOver').style.display = 'block';
        }

        function victory() {
            gameState.running = false;
            document.getElementById('victoryKills').textContent = gameState.kills;
            document.getElementById('victoryLevel').textContent = gameState.level;
            document.getElementById('victoryScreen').style.display = 'block';
        }

        // 이벤트 리스너
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('victoryRestartBtn').addEventListener('click', startGame);

        // 게임 루프 시작
        gameLoop(0);
    </script>
</body>
</html>
